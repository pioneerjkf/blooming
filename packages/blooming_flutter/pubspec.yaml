name: blooming_flutter
description: "Fine-grained reactive UI bindings, durable animations, and Listenable bridges for Flutter powered by Bloom."

homepage: https://pioneerjkf.dev
repository: https://github.com/pioneerjkf/blooming
issue_tracker: https://github.com/pioneerjkf/blooming/issues
topics:
  - flutter
  - state-management
  - reactivity
  - widgets
  - ui

resolution: workspace

version: 0.1.2

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  blooming: ^0.1.2

  blooming_extensions: ^0.1.2
  
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  benchmark_harness: ^2.2.0
  test: ^1.25.0
  blooming_test: ^0.1.2

screenshots:
  - description: "The Bloom Flutter reactive UI engine logo."
    path: screenshots/logo.png
