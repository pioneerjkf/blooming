<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 740" width="100%" height="100%" role="img" aria-label="LPDAG Phase 2 Lazy-Pull Diagram">
  <title>LPDAG Phase 2: Lazy-Pull (On-Demand Evaluation)</title>
  <desc>Upstream on-demand evaluation: topological reverse pull evaluates Left and Right exactly once, producing a glitch-free Sum resolution.</desc>

  <defs>
    <!-- Forward Pointing Arrow Marker (Aligned with upward line direction) -->
    <marker id="arrow-pull-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E4E4E7" />
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card-bg {
      fill: #27272A;
      stroke: #3F3F46;
      stroke-width: 1.5;
    }

    /* Modern Squircle Node Cards - Neutral Titanium Zinc */
    .node-box {
      fill: #18181B;
      stroke: #3F3F46;
      stroke-width: 1.2;
    }
    .node-box-active {
      fill: #202024;
      stroke: #A1A1AA;
      stroke-width: 1.4;
      stroke-opacity: 0.85;
    }

    .node-title {
      font-size: 15px;
      font-weight: 600;
      fill: #F4F4F5;
      letter-spacing: -0.01em;
    }
    .node-type {
      font-size: 10px;
      font-weight: 600;
      fill: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .node-code {
      font-size: 12px;
      font-weight: 400;
      fill: #D4D4D8;
    }

    .pull-edge-solid {
      stroke: #E4E4E7;
      stroke-width: 1.8;
      fill: none;
    }

    .meta-label {
      font-size: 10.5px;
      font-weight: 500;
      fill: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .grid-line {
      stroke: rgba(244, 244, 245, 0.08);
      stroke-width: 1.0;
    }
    .step-circle {
      fill: #18181B;
      stroke: #3F3F46;
      stroke-width: 1.2;
    }
  </style>

  <!-- Clean Frameless Outer Squircle (No Inner Border) -->
  <rect class="card-bg" x="8" y="8" width="824" height="724" rx="28" />

  <!-- Header Level -->
  <g transform="translate(36, 40)">
    <rect x="0" y="-12" width="132" height="22" rx="11" ry="11" fill="rgba(244, 244, 245, 0.10)" stroke="rgba(244, 244, 245, 0.35)" stroke-width="1.2" />
    <text x="66" y="3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#F4F4F5" letter-spacing="0.10em">LPDAG PHASE 2</text>
    <text class="meta-label" x="148" y="3">LAZY-PULL · ON-DEMAND EVALUATION</text>
    <text class="meta-label" x="768" y="3" text-anchor="end">EXACTLY-ONCE TOPOLOGICAL RESOLUTION</text>
  </g>

  <line class="grid-line" x1="36" y1="58" x2="804" y2="58" />

  <!-- =================================================================== -->
  <!-- 01. SOURCE NODE (Top Center)                                        -->
  <!-- =================================================================== -->
  <g transform="translate(260, 96)">
    <rect class="node-box" x="0" y="0" width="320" height="96" rx="18" ry="18" />
    <text class="node-type" x="22" y="28">SOURCE NODE</text>
    <text class="node-title" x="22" y="54">BloomController (Source count)</text>
    <text class="node-code" x="22" y="78">state: <tspan fill="#34D399" font-weight="600">count = 2</tspan> <tspan fill="#71717A">(clean snapshot)</tspan></text>
    
    <!-- Clean Badge -->
    <rect x="232" y="16" width="66" height="22" rx="11" ry="11" fill="rgba(16, 185, 129, 0.10)" stroke="rgba(16, 185, 129, 0.40)" stroke-width="1.2" />
    <text x="265" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">CLEAN</text>
  </g>

  <!-- Flow between Level 1 and Level 2 (64px Gap: y=192 to y=256) -->
  <!-- Pull 3: Left(A) to Source count (Upward Pull) -->
  <path class="pull-edge-solid" d="M 215 256 L 215 224 L 350 224 L 350 194" marker-end="url(#arrow-pull-up)" />
  <g transform="translate(283, 224)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">3</text>
  </g>

  <!-- Pull 5: Right(B) to Source count (Upward Pull) -->
  <path class="pull-edge-solid" d="M 625 256 L 625 224 L 490 224 L 490 194" marker-end="url(#arrow-pull-up)" />
  <g transform="translate(558, 224)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">5</text>
  </g>

  <!-- =================================================================== -->
  <!-- 02. COMPUTED RELAY NODES: LEFT & RIGHT (Middle Level)               -->
  <!-- =================================================================== -->
  <!-- Left Node (A) -->
  <g transform="translate(60, 256)">
    <rect class="node-box" x="0" y="0" width="310" height="96" rx="18" ry="18" />
    <text class="node-type" x="22" y="28">COMPUTED RELAY</text>
    <text class="node-title" x="22" y="54">computed: Left (A)</text>
    <text class="node-code" x="22" y="78">_pull(): 2 * 2 → <tspan fill="#F4F4F5" font-weight="600">4</tspan> <tspan fill="#71717A">(computed once)</tspan></text>

    <!-- Clean Badge -->
    <rect x="228" y="16" width="66" height="22" rx="11" ry="11" fill="rgba(16, 185, 129, 0.10)" stroke="rgba(16, 185, 129, 0.40)" stroke-width="1.2" />
    <text x="261" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">CLEAN</text>
  </g>

  <!-- Right Node (B) -->
  <g transform="translate(470, 256)">
    <rect class="node-box" x="0" y="0" width="310" height="96" rx="18" ry="18" />
    <text class="node-type" x="22" y="28">COMPUTED RELAY</text>
    <text class="node-title" x="22" y="54">computed: Right (B)</text>
    <text class="node-code" x="22" y="78">_pull(): 2 + 10 → <tspan fill="#F4F4F5" font-weight="600">12</tspan> <tspan fill="#71717A">(computed once)</tspan></text>

    <!-- Clean Badge -->
    <rect x="228" y="16" width="66" height="22" rx="11" ry="11" fill="rgba(16, 185, 129, 0.10)" stroke="rgba(16, 185, 129, 0.40)" stroke-width="1.2" />
    <text x="261" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">CLEAN</text>
  </g>

  <!-- Flow between Level 2 and Level 3 (64px Gap: y=352 to y=416) -->
  <!-- Pull 2: Sum C pulls Left(A) (Upward Pull) -->
  <path class="pull-edge-solid" d="M 300 416 L 300 384 L 215 384 L 215 354" marker-end="url(#arrow-pull-up)" />
  <g transform="translate(258, 384)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">2</text>
  </g>

  <!-- Pull 4: Sum C pulls Right(B) (Upward Pull) -->
  <path class="pull-edge-solid" d="M 540 416 L 540 384 L 625 384 L 625 354" marker-end="url(#arrow-pull-up)" />
  <g transform="translate(582, 384)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">4</text>
  </g>

  <!-- =================================================================== -->
  <!-- 03. COMPUTED RELAY: SUM NODE (C) (Lower Middle Level)               -->
  <!-- =================================================================== -->
  <g transform="translate(190, 416)">
    <rect class="node-box-active" x="0" y="0" width="460" height="98" rx="18" ry="18" />
    <text class="node-type" x="24" y="28" fill="#F4F4F5">COMPUTED RELAY</text>
    <text class="node-title" x="24" y="54">computed: Sum (C = A + B)</text>
    <text class="node-code" x="24" y="78">_pull(): 4 + 12 = <tspan fill="#F4F4F5" font-weight="700">16</tspan> <tspan fill="#71717A">(Executed Exactly Once · Glitch-Free)</tspan></text>

    <!-- Clean Badge -->
    <rect x="374" y="16" width="66" height="22" rx="11" ry="11" fill="rgba(16, 185, 129, 0.10)" stroke="rgba(16, 185, 129, 0.40)" stroke-width="1.2" />
    <text x="407" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#34D399">CLEAN</text>
  </g>

  <!-- Flow between Level 3 and Level 4 (60px Gap: y=514 to y=574) -->
  <!-- Pull 1: BloomTerminal pulls Sum (Upward Pull) -->
  <path class="pull-edge-solid" d="M 420 574 L 420 516" marker-end="url(#arrow-pull-up)" />
  <g transform="translate(420, 544)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">1</text>
  </g>

  <!-- =================================================================== -->
  <!-- 04. TERMINAL CONSUMER: BLOOMTERMINAL (Bottom Level)                 -->
  <!-- =================================================================== -->
  <g transform="translate(240, 574)">
    <rect class="node-box" x="0" y="0" width="360" height="88" rx="18" ry="18" />
    <text class="node-type" x="180" y="28" text-anchor="middle">TERMINAL CONSUMER</text>
    <text class="node-title" x="180" y="52" font-size="15" text-anchor="middle">BloomTerminal (Flutter Widget / Subscriber)</text>
    <text class="node-code" x="180" y="74" font-size="11.5" fill="#F4F4F5" text-anchor="middle">Frame Render reads .data (Clean Snapshot: 16)</text>
  </g>

  <!-- Bottom Specification Footer (English Only) -->
  <line class="grid-line" x1="36" y1="690" x2="804" y2="690" />
  <text class="meta-label" x="420" y="708" font-size="10" text-anchor="middle" fill="#A1A1AA">
    LAZY-PULL: TOPOLOGICAL RESOLUTION · LEFT (4) &amp; RIGHT (12) EVALUATED ONCE · SUM (16) GLITCH-FREE
  </text>
</svg>
