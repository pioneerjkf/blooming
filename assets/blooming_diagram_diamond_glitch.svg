<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 630" width="100%" height="100%" role="img" aria-label="Diamond Dependency Glitch Diagram">
  <title>The Glitch Problem in Eager Push Systems</title>
  <desc>Canonical Diamond Dependency graph showing transient inconsistent state and redundant rebuilds in eager push reactive frameworks.</desc>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-silver" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#E4E4E7" />
    </marker>

    <marker id="arrow-glitch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#FB7185" />
    </marker>

    <marker id="arrow-delayed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#71717A" />
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card-bg {
      fill: #27272A;
      stroke: #3F3F46;
      stroke-width: 1.5;
    }

    /* Modern Squircle Node Cards - Neutral Titanium Zinc */
    .node-box {
      fill: #18181B;
      stroke: #3F3F46;
      stroke-width: 1.2;
    }
    .node-box-glitch {
      fill: #22181B;
      stroke: #FB7185;
      stroke-width: 1.4;
      stroke-opacity: 0.75;
    }

    .node-title {
      font-size: 15px;
      font-weight: 600;
      fill: #F4F4F5;
      letter-spacing: -0.01em;
    }
    .node-type {
      font-size: 10px;
      font-weight: 600;
      fill: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .node-code {
      font-size: 12px;
      font-weight: 400;
      fill: #D4D4D8;
    }

    .flow-edge {
      stroke: #E4E4E7;
      stroke-width: 1.8;
      fill: none;
    }
    .flow-edge-glitch {
      stroke: #FB7185;
      stroke-width: 1.8;
      stroke-dasharray: 5 4;
      fill: none;
    }
    .flow-edge-delayed {
      stroke: #71717A;
      stroke-width: 1.6;
      stroke-dasharray: 4 4;
      fill: none;
    }

    .meta-label {
      font-size: 10.5px;
      font-weight: 500;
      fill: #A1A1AA;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .grid-line {
      stroke: rgba(244, 244, 245, 0.08);
      stroke-width: 1.0;
    }
    .step-circle {
      fill: #18181B;
      stroke: #3F3F46;
      stroke-width: 1.2;
    }
  </style>

  <!-- Clean Frameless Outer Squircle (No Inner Border) -->
  <rect class="card-bg" x="8" y="8" width="824" height="614" rx="28" />

  <!-- Header Level -->
  <g transform="translate(36, 40)">
    <rect x="0" y="-12" width="170" height="22" rx="11" ry="11" fill="rgba(251, 113, 133, 0.12)" stroke="rgba(251, 113, 133, 0.45)" stroke-width="1.2" />
    <text x="85" y="3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FB7185" letter-spacing="0.10em">EAGER PUSH LIMITATION</text>
    <text class="meta-label" x="185" y="3">CANONICAL DIAMOND GRAPH</text>
    <text class="meta-label" x="768" y="3" text-anchor="end">TRANSIENT GLITCH STATE</text>
  </g>

  <line class="grid-line" x1="36" y1="58" x2="804" y2="58" />

  <!-- =================================================================== -->
  <!-- 01. SOURCE NODE (Top Center)                                        -->
  <!-- =================================================================== -->
  <g transform="translate(260, 96)">
    <rect class="node-box" x="0" y="0" width="320" height="96" rx="18" ry="18" stroke="#FB7185" stroke-opacity="0.50" />
    <text class="node-type" x="22" y="28">SOURCE NODE</text>
    <text class="node-title" x="22" y="54">BloomController (Source count)</text>
    <text class="node-code" x="22" y="78">count: <tspan fill="#F4F4F5" font-weight="600">1</tspan> → <tspan fill="#FB7185" font-weight="600">2 (dirty)</tspan></text>
    
    <!-- State Dirty Badge -->
    <rect x="232" y="16" width="66" height="22" rx="11" ry="11" fill="rgba(251, 113, 133, 0.12)" stroke="rgba(251, 113, 133, 0.45)" stroke-width="1.2" />
    <text x="265" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#FB7185">DIRTY</text>
  </g>

  <!-- Flow Arrows from Source to Left & Right (64px Gap: y=192 to y=256) -->
  <!-- Left Push Path (Immediate) -->
  <path class="flow-edge" d="M 350 192 L 350 224 L 215 224 L 215 254" marker-end="url(#arrow-silver)" />
  <g transform="translate(283, 224)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F4F5">1</text>
  </g>

  <!-- Right Push Path (Delayed) -->
  <path class="flow-edge-delayed" d="M 490 192 L 490 224 L 625 224 L 625 254" marker-end="url(#arrow-delayed)" />
  <g transform="translate(558, 224)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#71717A">3</text>
  </g>

  <!-- =================================================================== -->
  <!-- 02. COMPUTED RELAYS: LEFT (A) & RIGHT (B)                           -->
  <!-- =================================================================== -->
  <!-- Left Node (A) -->
  <g transform="translate(60, 256)">
    <rect class="node-box" x="0" y="0" width="310" height="96" rx="18" ry="18" />
    <text class="node-type" x="22" y="28">COMPUTED RELAY</text>
    <text class="node-title" x="22" y="54">computed: Left (A)</text>
    <text class="node-code" x="22" y="78">A = count * 2 → <tspan fill="#F4F4F5" font-weight="600">4</tspan></text>
  </g>

  <!-- Right Node (B) -->
  <g transform="translate(470, 256)">
    <rect class="node-box" x="0" y="0" width="310" height="96" rx="18" ry="18" />
    <text class="node-type" x="22" y="28">COMPUTED RELAY</text>
    <text class="node-title" x="22" y="54">computed: Right (B)</text>
    <text class="node-code" x="22" y="78">B = count + 10 → <tspan fill="#F4F4F5" font-weight="600">12</tspan> <tspan fill="#71717A">(old: 11)</tspan></text>
  </g>

  <!-- Flow Arrows from Left & Right to Sum (64px Gap: y=352 to y=416) -->
  <!-- Left to Sum (Glitch Trigger) -->
  <path class="flow-edge-glitch" d="M 215 352 L 215 384 L 300 384 L 300 414" marker-end="url(#arrow-glitch)" />
  <g transform="translate(258, 384)">
    <circle class="step-circle" cx="0" cy="0" r="14" stroke="#FB7185" stroke-opacity="0.60" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#FB7185">2</text>
  </g>

  <!-- Right to Sum (Second Recompute Push) -->
  <path class="flow-edge-delayed" d="M 625 352 L 625 384 L 540 384 L 540 414" marker-end="url(#arrow-delayed)" />
  <g transform="translate(582, 384)">
    <circle class="step-circle" cx="0" cy="0" r="14" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#71717A">4</text>
  </g>

  <!-- =================================================================== -->
  <!-- 03. COMPUTED RELAY: SUM NODE (Bottom Center)                        -->
  <!-- =================================================================== -->
  <g transform="translate(180, 416)">
    <rect class="node-box-glitch" x="0" y="0" width="480" height="126" rx="18" ry="18" />
    <text class="node-type" x="24" y="28" fill="#FB7185">COMPUTED RELAY</text>
    <text class="node-title" x="24" y="54">computed: Sum (C = A + B)</text>
    
    <!-- Glitch Badge -->
    <rect x="338" y="16" width="122" height="24" rx="12" ry="12" fill="rgba(251, 113, 133, 0.12)" stroke="rgba(251, 113, 133, 0.45)" stroke-width="1.2" />
    <text x="399" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FB7185">⚠️ DIRTY GLITCH</text>

    <!-- State breakdown -->
    <text class="node-code" x="24" y="82">
      Step 2 eval: <tspan fill="#F4F4F5" font-weight="600">4 (new A)</tspan> + <tspan fill="#A1A1AA">11 (old B)</tspan> = <tspan fill="#FB7185" font-weight="700">15 [GLITCH INCONSISTENCY]</tspan>
    </text>
    <text class="node-code" x="24" y="106">
      Step 4 eval: <tspan fill="#F4F4F5" font-weight="600">4 (new A)</tspan> + <tspan fill="#F4F4F5" font-weight="600">12 (new B)</tspan> = <tspan fill="#F4F4F5" font-weight="700">16</tspan> <tspan fill="#71717A">[2nd Redundant Recompute]</tspan>
    </text>
  </g>

  <!-- Technical Footer Annotation (English Only) -->
  <line class="grid-line" x1="36" y1="576" x2="804" y2="576" />
  <text class="meta-label" x="420" y="594" font-size="10" text-anchor="middle">
    TRADITIONAL EAGER PUSH: UNCOORDINATED MULTI-PASS EVALUATIONS CAUSE TRANSIENT FLICKER &amp; WASTED CPU
  </text>
</svg>
